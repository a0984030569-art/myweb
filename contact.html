<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawffee Cafe - 聯絡我們</title>
  <!-- Google Fonts 溫潤圓體 -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
        --primary-pink: #FFB6C1;
        --soft-cream: #FFFDF9;
        --warm-brown: #5C4033;
        --accent-brown: #8B5A2B;
        --light-pink-bg: #FFF0F2;
        --border-color: #E8D7D0;
    }

    * { 
        box-sizing: border-box; 
        font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
        margin: 0; 
        padding: 0; 
    }
    
    body { 
        background-color: var(--soft-cream); 
        color: var(--warm-brown); 
        line-height: 1.6; 
    }
    
    header { 
        background-color: var(--light-pink-bg); 
        color: var(--accent-brown); 
        padding: 2.5rem 1rem; 
        text-align: center; 
        border-bottom: 2px dashed var(--border-color);
    }
    
    header h1 { 
        font-size: 2.2rem; 
        margin-bottom: 8px; 
    }

    header p {
        color: #7A5C58;
        font-size: 1.1rem;
    }
    
    nav { 
        background-color: var(--soft-cream); 
        border-bottom: 2px dashed var(--border-color);
        padding: 12px; 
        text-align: center; 
        position: sticky; 
        top: 0; 
        z-index: 100; 
    }
    
    nav a { 
        color: var(--warm-brown); 
        text-decoration: none; 
        margin: 0 15px; 
        font-weight: bold; 
        font-size: 1.05rem; 
        transition: color 0.3s;
    }
    
    nav a:hover, nav a.active { 
        color: #FF69B4; 
    }
    
    .container { 
        max-width: 800px; 
        margin: 35px auto; 
        padding: 0 20px; 
    }

    .card { 
        background: white; 
        border-radius: 16px; 
        padding: 35px; 
        box-shadow: 0 4px 15px rgba(92, 64, 51, 0.05); 
        border: 1px solid var(--border-color);
    }

    h2 { 
        color: var(--accent-brown); 
        margin-bottom: 25px; 
        border-bottom: 3px solid var(--primary-pink); 
        padding-bottom: 8px; 
        text-align: center; 
        font-size: 1.6rem;
    }
    
    .form-group { 
        margin-bottom: 20px; 
    }

    label { 
        display: block; 
        font-weight: bold; 
        margin-bottom: 8px; 
        color: var(--warm-brown); 
    }

    input, textarea { 
        width: 100%; 
        padding: 12px 15px; 
        border: 1px solid var(--border-color); 
        border-radius: 12px; 
        font-size: 15px; 
        background-color: var(--soft-cream);
        color: var(--warm-brown);
        font-family: 'Zen Maru Gothic', sans-serif;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: var(--primary-pink);
        background-color: #ffffff;
    }

    button { 
        width: 100%; 
        background-color: var(--primary-pink); 
        color: var(--warm-brown); 
        padding: 14px; 
        border: none; 
        border-radius: 30px; 
        font-size: 16px; 
        font-weight: bold; 
        cursor: pointer; 
        box-shadow: 0 4px 10px rgba(255, 182, 193, 0.4);
        transition: background 0.3s, transform 0.2s;
    }

    button:hover { 
        background-color: #ff9dae; 
        transform: translateY(-2px);
    }
    
    footer { 
        text-align: center; 
        padding: 30px 20px; 
        background-color: var(--light-pink-bg); 
        color: #7A5C58; 
        margin-top: 60px; 
        border-top: 2px dashed var(--border-color);
        font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 Pawffee Cafe 寵物友善咖啡廳</h1>
    <p>聯絡我們與線上預約訂位</p>
  </header>

  <nav>
    <a href="index.html">首頁</a>
    <a href="about.html">關於我們</a>
    <a href="menu.html">完整菜單</a>
    <a href="contact.html" class="active">聯絡我們</a>
  </nav>

  <div class="container">
    <div class="card">
      <h2>📩 聯絡我們 / 預約訂位</h2>
      
      <!-- 完全保留您原本的 Formspree 收信設定 -->
      <form action="https://formspree.io/f/maeebrwz" method="POST">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" name="姓名" required placeholder="請輸入您的姓名">
        </div>

        <div class="form-group">
          <label>電話 *</label>
          <input type="tel" name="電話" required placeholder="例如：0912345678">
        </div>

        <div class="form-group">
          <label>E-mail *</label>
          <input type="email" name="Email" required placeholder="例如：yourname@email.com">
        </div>

        <div class="form-group">
          <label>聯絡內容 / 預約需求 *</label>
          <textarea name="聯絡內容" rows="5" required placeholder="請輸入預約日期、人數與毛孩數量..."></textarea>
        </div>

        <button type="submit">送出訊息 📩</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2026 Pawffee Cafe | GitHub Pages</p>
  </footer>

</body>
</html>
