<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 | Pawffee Cafe 寵物友善咖啡廳</title>
    <!-- Google Fonts 溫潤圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF6F0;
            --primary-pink: #E88CA0;      /* 調整為溫柔浪漫的粉色系 */
            --primary-hover: #D77A90;     /* 粉色 hover 色 */
            --text-main: #5C4B43;
            --card-bg: #FFFFFF;
            --border-color: #F3D9DE;      /* 粉嫩柔和邊框 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
        }

        /* 統一的粉嫩高質感導覽列 */
        nav {
            background-color: var(--card-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 10px rgba(232, 140, 160, 0.05);
        }

        nav .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-pink);
            text-decoration: none;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--primary-pink);
        }

        /* 當前頁面保持粉色高亮 */
        nav ul li a.active {
            color: var(--primary-pink);
            font-weight: 700;
        }

        /* 聯絡表單區塊 */
        .contact-container {
            max-width: 650px;
            margin: 50px auto;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(232, 140, 160, 0.08);
            border: 1px solid var(--border-color);
        }

        .contact-container h1 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .contact-container p.subtitle {
            text-align: center;
            color: #8C7B73;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #FAFAFA;
            font-size: 1rem;
            color: var(--text-main);
            font-family: inherit;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-pink);
            background-color: #FFFFFF;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        #form-status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: var(--primary-pink);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #8C7B73;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- 統一的粉嫩 5 個功能選單導覽列 -->
    <nav>
        <a href="index.html" class="logo">🐾 Pawffee Cafe</a>
        <ul>
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於我們</a></li>
            <li><a href="menu.html">完整菜單</a></li>
            <li><a href="contact.html" class="active">聯絡我們</a></li>
            <li><a href="member.html">會員中心</a></li>
        </ul>
    </nav>

    <!-- 聯絡與預約表單主體 -->
    <div class="contact-container">
        <h1>聯絡我們與預約</h1>
        <p class="subtitle">填寫下方表單，訊息將直接發送到管理員信箱！</p>
        
        <form id="ajax-form">
            <input type="hidden" name="_subject" value="【Pawffee Cafe】收到新的預約與聯絡訊息！">
            <input type="hidden" name="_template" value="table">

            <div class="form-group">
                <label for="name">您的姓名</label>
                <input type="text" id="name" name="name" required placeholder="例如：林小姐">
            </div>

            <div class="form-group">
                <label for="email">您的電子信箱</label>
                <input type="email" id="email" name="email" required placeholder="your_email@example.com">
            </div>

            <div class="form-group">
                <label for="phone">聯絡電話</label>
                <input type="tel" id="phone" name="phone" required placeholder="例如：0912-345-678">
            </div>

            <div class="form-group">
                <label for="message">預約內容或想說的話</label>
                <textarea id="message" name="message" rows="5" required placeholder="請輸入您想預約的時間、人數，或攜帶的毛小孩資訊..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">送出預約與訊息</button>
            <div id="form-status"></div>
        </form>
    </div>

    <footer>
        &copy; 2026 Pawffee Cafe 寵物友善咖啡廳 All Rights Reserved.
    </footer>

    <script>
        const form = document.getElementById('ajax-form');
        const statusDiv = document.getElementById('form-status');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            statusDiv.textContent = "正在透過伺服器發送信件...";

            const formData = new FormData(form);

            fetch("https://formsubmit.co/ajax/a0984030569@gmail.com", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.textContent = "✨ 發送成功！訊息已確實寄到您的管理員信箱！";
                    form.reset();
                } else {
                    statusDiv.textContent = "❌ 發送失敗，請稍後再試。";
                }
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            })
            .catch(error => {
                statusDiv.textContent = "❌ 發生錯誤，請檢查網路連線。";
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            });
        });
    </script>

</body>
</html>
