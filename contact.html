<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 | Pawffee Cafe 寵物友善咖啡廳</title>
    <!-- Google Fonts 溫潤圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF6F0;
            --primary-pink: #E8A87C;
            --text-main: #5C4B43;
            --card-bg: #FFFFFF;
            --border-color: #EADBC8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
        }

        nav {
            background-color: var(--card-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-pink);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--primary-pink);
        }

        .contact-container {
            max-width: 650px;
            margin: 50px auto;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(92, 75, 67, 0.08);
            border: 1px solid var(--border-color);
        }

        .contact-container h1 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .contact-container p.subtitle {
            text-align: center;
            color: #8C7B73;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #FAFAFA;
            font-size: 1rem;
            color: var(--text-main);
            font-family: inherit;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-pink);
            background-color: #FFFFFF;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #D6956B;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #8C7B73;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">🐾 Pawffee Cafe</a>
        <ul>

            <li><a href="about.html">關於我們</a></li>
            <li><a href="contact.html" style="color: var(--primary-pink);">聯絡我們</a></li>
        </ul>
    </nav>
