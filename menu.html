<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整菜單 - Pawffee Cafe 寵物友善咖啡廳</title>
    <!-- Google Fonts 溫潤圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #FFB6C1;
            --soft-cream: #FFFDF9;
            --warm-brown: #5C4033;
            --accent-brown: #8B5A2B;
            --light-pink-bg: #FFF0F2;
            --border-color: #E8D7D0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--soft-cream);
            color: var(--warm-brown);
            line-height: 1.6;
        }

        /* 導覽列 */
        header {
            background-color: var(--light-pink-bg);
            color: var(--accent-brown);
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            color: #7A5C58;
            font-size: 1.1rem;
        }

        nav {
            background-color: var(--soft-cream);
            border-bottom: 2px dashed var(--border-color);
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: var(--warm-brown);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #FF69B4;
        }

        /* 菜單主內容 */
        .menu-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .menu-section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.6rem;
            color: var(--accent-brown);
            border-bottom: 3px solid var(--primary-pink);
            padding-bottom: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        @media (max-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }

        .menu-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(92, 64, 51, 0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer; /* 讓滑鼠移上去變成手指，暗示可以點擊 */
        }

        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 182, 193, 0.3);
            border-color: var(--primary-pink);
        }

        .menu-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .menu-info {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .menu-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--warm-brown);
        }

        .menu-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #D2691E;
        }

        .menu-desc {
            font-size: 0.95rem;
            color: #7A5C58;
        }

        .click-hint {
            font-size: 0.8rem;
            color: #B58882;
            margin-top: 6px;
        }

        /* 彈跳視窗 (Modal) 樣式 */
        .modal {
            display: none; /* 預設隱藏 */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(92, 64, 51, 0.4); /* 半透明暖棕色遮罩 */
            backdrop-filter: blur(3px); /* 背景模糊特效 */
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(92, 64,
