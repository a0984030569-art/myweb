<section id="contact" class="card">
  <h2>🐾 聯絡我們 / 預約諮詢</h2>
  
  <div class="form-group">
    <label>姓名 *</label>
    <input type="text" id="p_name" placeholder="請輸入您的姓名">
  </div>

  <div class="form-group">
    <label>電話 *</label>
    <input type="tel" id="p_phone" placeholder="例如：0912345678">
  </div>

  <div class="form-group">
    <label>E-mail *</label>
    <input type="email" id="p_email" placeholder="例如：yourname@email.com">
  </div>

  <div class="form-group">
    <label>聯絡內容 / 預約需求 *</label>
    <textarea id="p_message" rows="4" placeholder="請輸入您的預約需求或諮詢內容..."></textarea>
  </div>

  <button type="button" onclick="sendMailNow()">開啟郵件軟體寄出 📩</button>
</section>

<script>
function sendMailNow() {
  var name = document.getElementById("p_name").value.trim();
  var phone = document.getElementById("p_phone").value.trim();
  var email = document.getElementById("p_email").value.trim();
  var message = document.getElementById("p_message").value.trim();

  if(!name || !phone || !email || !message) {
    alert("請填寫所有欄位！");
    return;
  }

  var subject = encodeURIComponent("【Pawffee Cafe】來自官網的聯絡預約");
  var body = encodeURIComponent(
    "姓名：" + name + "\n" +
    "電話：" + phone + "\n" +
    "Email：" + email + "\n\n" +
    "預約與聯絡需求：\n" + message
  );

  // 直接開啟系統郵件程式，不會跳出 Chrome 警告
  window.location.href = "mailto:a0984030569@gmail.com?subject=" + subject + "&body=" + body;
}
</script>
